schema_version: 1
id: cascade_router.simple_lookup
feature: cascade_router
feature_flag_id: flag.cascade_router
flag_default: "off"
owner: crates/ironclaw_llm
stage: local
repetitions: 200
input:
  prompt: "Return the city name in this sentence: Berlin."
  risk: low
  contains_private_data: false
mocked_dependencies:
  providers:
    cheap:
      latency_ms: 650
      cost_microusd: 120
      quality_pass: true
    primary:
      latency_ms: 1500
      cost_microusd: 900
      quality_pass: true
baseline:
  variant: current_static_router
  expected_provider: primary
variant:
  variant: cost_quality_shadow_router
  expected_provider: cheap
oracle:
  type: deterministic_answer_shape
  must_include:
    - Berlin
expected_metrics:
  median_cost_reduction_min_pct: 20
  min_eligible_events: 200
guardrails:
  max_quality_regression_pp: 2
  max_p95_latency_regression_pct: 10
  max_fallback_rate_delta_pp: 2
  forbid_policy_violations: true
metric_bounds:
  pct_values_min: 0
  pct_values_max: 100
  rate_values_min: 0.0
  rate_values_max: 1.0
  latency_ms_min: 0
artifacts:
  write_jsonl: true
  retain_raw_prompt: false
