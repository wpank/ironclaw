schema_version: 1
id: signal_records.near_duplicate_preference
feature: signal_records
feature_flag_id: flag.signal_records
flag_default: "off"
owner: src/workspace
stage: local
repetitions: 50
input:
  memories:
    - "Use short factual answers for build failures."
    - "When a build fails, keep the answer short and factual."
  query: "How should you answer when my build fails?"
mocked_dependencies:
  embedding_provider: deterministic_fixture
baseline:
  variant: current_memory_write
  expected_records: 2
variant:
  variant: signal_soft_dedupe
  expected_duplicate_candidate: true
oracle:
  type: retrieval_relevance
  expected_top5_contains: "short factual answers for build failures"
expected_metrics:
  duplicate_storage_reduction_min_pct: 30
  top5_relevance_min: 0.95
guardrails:
  max_write_latency_p95_ms: 100
  max_false_duplicate_rate: 0.02
  max_relevance_regression_pp: 2
metric_bounds:
  pct_values_min: 0
  pct_values_max: 100
  rate_values_min: 0.0
  rate_values_max: 1.0
  latency_ms_min: 0
artifacts:
  retain_memory_bodies: synthetic_local_only
  retain_raw_private_memory: false
