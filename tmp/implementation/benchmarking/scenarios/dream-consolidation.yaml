schema_version: 1
id: dream_consolidation.rare_dependency_failure
feature: dream_consolidation
feature_flag_id: flag.dream_consolidation
flag_default: "off"
owner: src/agent
stage: local
repetitions: 50
input:
  session_fixture: rare_dependency_failure_session.json
  later_query: "Why does this dependency fail only on CI?"
mocked_dependencies:
  llm: deterministic_summary_model
  memory_store: ephemeral_dual_backend_contract
baseline:
  variant: no_background_consolidation
  expected_background_writes: 0
variant:
  variant: bounded_dream_replay
  max_background_writes: 3
oracle:
  type: later_retrieval_usefulness
  expected_memory_tags:
    - derived
    - llm_generated
    - dependency_failure
expected_metrics:
  useful_memory_hit_rate_delta_min_pp: 10
  promoted_memory_precision_min: 0.80
guardrails:
  max_background_cost_microusd: 25000
  max_background_latency_ms: 2000
  max_promoted_memories: 3
  forbid_sensitive_data_leak: true
metric_bounds:
  pct_values_min: 0
  pct_values_max: 100
  rate_values_min: 0.0
  rate_values_max: 1.0
  latency_ms_min: 0
artifacts:
  retain_derived_memories: redacted
  retain_raw_session: false
