schema_version: 1
id: provider_conductor.latency_ramp
feature: provider_conductor
feature_flag_id: flag.provider_conductor
flag_default: "off"
owner: crates/ironclaw_llm
stage: local
repetitions: 100
input:
  request_class: medium_code_reasoning
  sequence_length: 100
mocked_dependencies:
  provider_a:
    latency_ms_sequence: [900, 950, 1100, 1350, 1700, 2300]
    error_rate_after_step: 0.15
  provider_b:
    latency_ms_sequence: [1200, 1180, 1190, 1210]
    error_rate_after_step: 0.01
baseline:
  variant: reactive_circuit_breaker
variant:
  variant: forecast_bias
oracle:
  type: avoided_degradation
expected_metrics:
  degraded_provider_spend_reduction_pct_min: 50
  warning_lead_time_min_requests: 1
guardrails:
  max_healthy_provider_false_positive_rate: 0.03
  max_oscillation_count: 1
  max_prediction_lead_time_requests: 10
  max_p95_latency_regression_pct: 10
metric_bounds:
  pct_values_min: 0
  pct_values_max: 100
  rate_values_min: 0.0
  rate_values_max: 1.0
  latency_ms_min: 0
artifacts:
  retain_health_series: true
  retain_raw_prompt: false
