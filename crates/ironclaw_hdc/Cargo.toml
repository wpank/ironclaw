[package]
name = "ironclaw_hdc"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Hyperdimensional computing primitives for memory deduplication and semantic similarity"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"

[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
rand = "0.10"
serde_json = "1"

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "scan"
harness = false
